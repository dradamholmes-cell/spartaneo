<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050607"><title>Ring Riot Custom Character Test</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050607;color:#effff3;font-family:'Courier New',monospace}main{max-width:620px;margin:0 auto;padding:24px}.box{border:1px solid #5ce987;background:#09110c;padding:16px}h1{margin:0 0 10px;color:#72ff9c;font-size:22px}.status{border:1px solid #4a604f;background:#111812;padding:10px;margin:12px 0;font-size:11px;line-height:1.5}button,a{display:block;width:100%;min-height:46px;border:1px solid #68ff94;background:#155a2d;color:#fff;text-align:center;padding:14px;text-decoration:none;font:900 11px 'Courier New',monospace;margin-top:9px}.bad{border-color:#8d4650;color:#ff9ca7}</style></head><body><main><div class="box"><h1>RING RIOT · CUSTOM GLB TEST</h1><p>This launches the development Ring Riot shell with the active custom Character Forge handoff. Production Ring Riot is not changed.</p><div id="status" class="status">CHECKING ACTIVE CHARACTER…</div><a id="launch" href="#" hidden>ENTER RING RIOT AS CUSTOM CHARACTER</a><a href="./v10.html">BACK TO CUSTOM LAB</a></div></main><script>(()=>{const status=document.getElementById('status'),launch=document.getElementById('launch');let h=null;try{h=JSON.parse(localStorage.getItem('ogb.customCharacter')||'null')}catch{}if(!h?.characterId){status.textContent='NO CUSTOM CHARACTER ACTIVE · Pick a generated character in BUILD .07c first.';status.classList.add('bad');return}if(!h.modelUrl){status.textContent='CUSTOM CHARACTER SELECTED, BUT THERE IS NO REAL GLB TICKET YET · D1/R2 DEV HOST MUST BE RUNNING.';status.classList.add('bad');return}const u=new URL('./games/ring-riot/index.html',location.href);u.searchParams.set('arcade','1');u.searchParams.set('character',h.character||('custom:'+h.characterId));u.searchParams.set('characterName',h.characterName||'Custom Character');u.searchParams.set('characterModel',h.modelUrl);launch.href=u.href;launch.hidden=false;launch.textContent='ENTER RING RIOT AS '+String(h.characterName||'CUSTOM').toUpperCase();status.textContent='READY · '+String(h.characterName||'Custom Character')+' · ticket expires '+(h.expiresAt?new Date(h.expiresAt).toLocaleTimeString():'soon')})()</script></body></html>
