<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spartaneo Merch Tools</title><style>body{margin:0;font-family:Arial,sans-serif;background:#111;color:#f4ead7}.wrap{max-width:900px;margin:auto;padding:42px 22px}.panel{background:#1b1b1b;border:1px solid #3b342a;border-radius:18px;padding:24px}.row{display:flex;gap:12px;flex-wrap:wrap}.btn{display:inline-block;padding:13px 18px;border-radius:10px;background:#d27b2c;color:#111;font-weight:800;border:0;text-decoration:none}.btn.alt{background:#2b2b2b;color:#f4ead7;border:1px solid #5b5145}.preview{margin-top:22px;background:#f3efe8;border-radius:16px;min-height:420px;display:grid;place-items:center;overflow:hidden}.preview img{max-width:70%;max-height:340px;object-fit:contain}.muted{color:#aaa}.types button{margin:4px}</style></head><body><div class="wrap"><a href="/">← HOME</a><h1>MERCH TOOLS</h1><p class="muted">Upload your design, preview it quickly, then jump to Printify to publish. No API keys are stored here.</p><div class="panel"><input id="file" type="file" accept="image/*"><div class="types row"><button class="btn alt" data-type="Short-sleeve shirt">SHORT SLEEVE</button><button class="btn alt" data-type="Hoodie">HOODIE</button><button class="btn alt" data-type="Men's cap">MEN'S CAP</button><button class="btn alt" data-type="Small wall canvas">SMALL CANVAS</button></div><h3 id="type">Short-sleeve shirt</h3><div class="preview"><img id="img" alt="Your design preview"></div><div class="row" style="margin-top:18px"><a class="btn" target="_blank" rel="noopener" href="https://printify.com/app/products">OPEN PRINTIFY PRODUCTS</a><a class="btn alt" href="/hannah">VIEW HANNAH PAGE</a></div></div></div><script>document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>document.getElementById('type').textContent=b.dataset.type);document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;document.getElementById('img').src=URL.createObjectURL(f)}</script></body></html>
